let idx=0, stars=0, locked=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function ruby(j){return [...j.zh].map((c,i)=>`<span class="ruby">${c}<small>${j.bpm[i]||""}</small></span>`).join("")}
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.72;u.pitch=1.05;speechSynthesis.speak(u)}
function say(){const j=jobs[idx];speak(j.letter+" is for "+j.job)}
function render(){
 locked=false;
 const cur=jobs[idx];
 document.getElementById("letter").textContent=cur.letter;
 document.getElementById("num").textContent=idx+1;
 document.getElementById("bar").style.width=(idx/jobs.length*100)+"%";
 document.getElementById("feedback").textContent="";
 document.getElementById("next").classList.add("hide");
 const box=document.getElementById("answers"); box.innerHTML="";
 shuffle(jobs).forEach(j=>{
   const b=document.createElement("div"); b.className="answer";
   b.innerHTML=`<img src="${j.img}" alt="${j.job}"><div><div class="en">${j.job}</div><div class="zh">${ruby(j)}</div></div>`;
   b.addEventListener("click",()=>pick(j,b)); box.appendChild(b);
 });
 setTimeout(say,350);
}
function pick(j,b){
 if(locked)return; const cur=jobs[idx];
 if(j.job===cur.job){locked=true;stars++;document.getElementById("stars").textContent=stars;b.classList.add("good");document.getElementById("feedback").textContent="⭐ Great job!";speak(cur.job);document.getElementById("next").classList.remove("hide")}
 else{b.classList.add("wrong");document.getElementById("feedback").textContent="💛 Try again!";speak(cur.job)}
}
document.getElementById("sound").addEventListener("click",say);
document.getElementById("next").addEventListener("click",()=>{idx=(idx+1)%jobs.length;render()});
render();
</script>
</body></html>
