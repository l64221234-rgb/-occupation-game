<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alphabet Occupations</title><style>*{box-sizing:border-box}body{font-family:-apple-system,sans-serif;margin:0;background:linear-gradient(#c9f2ff,#fff4bd);color:#15345d}main{max-width:700px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between}.pill,.card{background:#fff;border-radius:26px;box-shadow:0 8px 20px #0002}.pill{padding:10px 16px;font-weight:900}.card{padding:22px;margin-top:18px;text-align:center}#letter{font-size:76px;font-weight:1000;color:#743bea}button{width:100%;border:0;border-radius:20px;padding:17px;margin:8px 0;font-size:22px;font-weight:900;background:#e8f3ff}button small{display:block;font-size:17px;color:#61748e}#sound{background:#ffd65a}#next{background:#2f91ff;color:#fff}.hide{display:none}.good{background:#c9f7d6}.bad{background:#ffe0e0}#feedback{min-height:40px;font-size:23px;font-weight:900}</style></head><body><main><div class="top"><div class="pill">⭐ <span id="score">0</span></div><div class="pill"><span id="num">1</span>/26</div></div><div class="card"><div id="letter"></div><h2>🔊 Listen and find the job!</h2><button id="sound">🔊 再聽一次</button><div id="choices"></div><div id="feedback"></div><button id="next" class="hide">下一題 ➜</button></div></main><script>const DATA=[{"letter": "A", "job": "Astronaut", "zh": "太空人"}, {"letter": "B", "job": "Ballerina", "zh": "芭蕾舞者"}, {"letter": "C", "job": "Conductor", "zh": "指揮家"}, {"letter": "D", "job": "Doctor", "zh": "醫生"}, {"letter": "E", "job": "Engineer", "zh": "工程師"}, {"letter": "F", "job": "Firefighter", "zh": "消防員"}, {"letter": "G", "job": "Gardener", "zh": "園丁"}, {"letter": "H", "job": "Hairdresser", "zh": "美髮師"}, {"letter": "I", "job": "Illustrator", "zh": "插畫家"}, {"letter": "J", "job": "Jockey", "zh": "賽馬騎師"}, {"letter": "K", "job": "Karate instructor", "zh": "空手道教練"}, {"letter": "L", "job": "Librarian", "zh": "圖書館員"}, {"letter": "M", "job": "Musician", "zh": "音樂家"}, {"letter": "N", "job": "Nurse", "zh": "護理師"}, {"letter": "O", "job": "Optometrist", "zh": "驗光師"}, {"letter": "P", "job": "Pilot", "zh": "飛行員"}, {"letter": "Q", "job": "Queen", "zh": "女王"}, {"letter": "R", "job": "Race car driver", "zh": "賽車手"}, {"letter": "S", "job": "Scientist", "zh": "科學家"}, {"letter": "T", "job": "Teacher", "zh": "老師"}, {"letter": "U", "job": "Umpire", "zh": "裁判"}, {"letter": "V", "job": "Vet", "zh": "獸醫"}, {"letter": "W", "job": "Waiter", "zh": "服務生"}, {"letter": "X", "job": "X-ray technician", "zh": "X光技術員"}, {"letter": "Y", "job": "Yoga instructor", "zh": "瑜伽教練"}, {"letter": "Z", "job": "Zookeeper", "zh": "動物園管理員"}];let i=0,score=0,locked=false;const $=x=>document.getElementById(x);function sh(a){return [...a].sort(()=>Math.random()-.5)}function sp(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.72;speechSynthesis.speak(u)}function render(){locked=false;let c=DATA[i];$('letter').textContent=c.letter;$('num').textContent=i+1;$('feedback').textContent='';$('next').classList.add('hide');let opts=sh([c,...sh(DATA.filter((_,n)=>n!==i)).slice(0,2)]);$('choices').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.innerHTML=o.job+'<small>'+o.zh+'</small>';b.onclick=()=>pick(o,b);$('choices').appendChild(b)});setTimeout(()=>sp(c.job),250)}function pick(o,b){if(locked)return;let c=DATA[i];if(o.job===c.job){locked=true;score++;$('score').textContent=score;b.classList.add('good');$('feedback').textContent='⭐ Great job! '+c.letter+' is for '+c.job;sp(c.letter+' is for '+c.job);$('next').classList.remove('hide')}else{b.classList.add('bad');$('feedback').textContent='💛 Try again!';sp(c.job)}}$('sound').onclick=()=>sp(DATA[i].job);$('next').onclick=()=>{i++;if(i>=26){alert('完成 26 關！ ⭐ '+score);i=0;score=0;$('score').textContent=0}render()};render();</script></body></html>
